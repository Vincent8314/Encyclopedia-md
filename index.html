<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External Markdown Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>External Markdown Test</h1>
    <div class="controls">
      <label for="markdownUrl">Markdown URL</label>
      <input
        id="markdownUrl"
        type="url"
        placeholder="Paste a raw .md URL here"
      >
      <button id="loadButton">Load Markdown</button>
    </div>

    <p id="status" aria-live="polite">
      Enter a raw Markdown URL and click Load Markdown.
    </p>

    <article id="markdownOutput"></article>
  </main>

  <!-- Markdown converter -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
